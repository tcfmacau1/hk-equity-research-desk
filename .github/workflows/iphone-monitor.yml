name: iPhone 港股公告監察
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-filings
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 檢查獨立名單及港交所公告
        env:
          IPHONE_SUPABASE_URL: ${{ secrets.IPHONE_SUPABASE_URL }}
          IPHONE_PUBLISHABLE_KEY: ${{ secrets.IPHONE_PUBLISHABLE_KEY }}
          IPHONE_EMAIL: ${{ secrets.IPHONE_EMAIL }}
          IPHONE_PASSWORD: ${{ secrets.IPHONE_PASSWORD }}
        run: python3 scripts/monitor.py
